<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>짤·카드 스튜디오</title>
<style>
  :root{
    --bg:#fafafa;
    --surface:#ffffff;
    --text:#1a1a1a;
    --muted:#4b4b4b;
    --accent:#0b5fff;
    --danger:#c81e1e;
    --accent-contrast:#ffffff;
    --border:#e2e2e2;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    line-height:1.55;
  }
  main{
    max-width:980px;
    margin:0 auto;
    padding:24px 20px 60px;
  }
  h1{
    font-size:clamp(1.4rem,3.6vw,1.9rem);
    margin:0 0 6px;
  }
  p.lead{
    color:var(--muted);
    margin:0 0 20px;
    max-width:70ch;
  }
  .layout{
    display:flex;
    flex-wrap:wrap;
    gap:20px;
    align-items:flex-start;
  }
  .stage-col{flex:1 1 420px;min-width:0;}
  .side-col{flex:1 1 340px;min-width:0;}

  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:16px 18px;
    margin-bottom:16px;
  }
  .card h2{font-size:1.05rem;margin:0 0 10px;}

  #stage-wrap{
    width:100%;
    max-width:380px;
    margin:0 auto;
    border-radius:12px;
    overflow:hidden;
    border:1px solid var(--border);
    background:
      linear-gradient(45deg,#ccc 25%,transparent 25%) -8px 0/16px 16px,
      linear-gradient(-45deg,#ccc 25%,transparent 25%) -8px 0/16px 16px,
      linear-gradient(45deg,transparent 75%,#ccc 75%) -8px 0/16px 16px,
      linear-gradient(-45deg,transparent 75%,#ccc 75%) -8px 0/16px 16px,
      #f4f4f4;
  }
  canvas{display:block;width:100%;height:auto;}

  label{display:block;font-size:0.85rem;font-weight:600;margin:10px 0 4px;}
  label:first-child{margin-top:0;}
  textarea, input[type="text"]{
    width:100%;
    font:inherit;
    padding:8px 10px;
    border:1px solid var(--border);
    border-radius:8px;
    resize:vertical;
  }
  textarea{min-height:64px;}
  input[type="range"]{width:100%;}
  input[type="color"]{
    width:44px;height:30px;border:1px solid var(--border);border-radius:6px;padding:0;
  }
  .row{display:flex;align-items:center;gap:10px;}
  .row > *{flex:none;}
  .row .grow{flex:1;}

  .ratio-row{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
  button{
    font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--border);
    background:var(--surface);color:var(--text);padding:8px 13px;
  }
  button.primary{background:var(--accent);color:var(--accent-contrast);border-color:var(--accent);}
  button.active{background:var(--text);color:#fff;border-color:var(--text);}
  button:focus-visible{outline:3px solid var(--accent);outline-offset:2px;}
  button:disabled{opacity:0.5;cursor:not-allowed;}

  .msg{font-size:0.85rem;margin-top:8px;min-height:1.2em;}
  .msg.error{color:var(--danger);font-weight:600;}
  .msg.ok{color:#0a7d33;font-weight:600;}

  .tpl-item{
    display:flex;align-items:center;gap:6px;padding:8px 4px;border-bottom:1px solid var(--border);
    flex-wrap:wrap;
  }
  .tpl-item .name{flex:1;font-size:0.9rem;font-weight:600;min-width:80px;}
  .tpl-item button{padding:5px 9px;font-size:0.82rem;}
  #tpl-list{max-height:260px;overflow-y:auto;}

  .small-note{font-size:0.8rem;color:var(--muted);}
  .field-hint{font-size:0.78rem;color:var(--muted);margin-top:2px;}
  input[type="file"]{font-size:0.85rem;}
</style>
</head>
<body>
<main>
  <h1>짤·카드 스튜디오</h1>
  <p class="lead">이미지(또는 배경색)와 문구를 조합해 밈·카드·SNS 게시용 이미지를 만들고 PNG로 내려받습니다.</p>

  <div class="layout">
    <div class="stage-col">
      <div class="ratio-row" role="group" aria-label="화면비 선택">
        <button type="button" class="ratio-btn active" data-ratio="1:1">1:1</button>
        <button type="button" class="ratio-btn" data-ratio="4:5">4:5</button>
        <button type="button" class="ratio-btn" data-ratio="9:16">9:16</button>
      </div>

      <div id="stage-wrap">
        <canvas id="stage" width="1080" height="1080" aria-label="편집 미리보기"></canvas>
      </div>

      <div class="card" style="margin-top:14px;">
        <h2>이미지·배경</h2>
        <label for="file-input">이미지 불러오기 (PNG, JPEG만 가능)</label>
        <input type="file" id="file-input" accept="image/png,image/jpeg">
        <p class="msg" id="file-msg" aria-live="polite"></p>

        <label for="bg-color">배경색 (이미지가 없거나, 투명한 부분에 보입니다)</label>
        <input type="color" id="bg-color" value="#111827">

        <div class="row" style="margin-top:10px;">
          <button type="button" id="btn-remove-image">이미지 제거</button>
          <button type="button" id="btn-download" class="primary">PNG로 다운로드</button>
        </div>
      </div>

      <div class="card">
        <h2>문구</h2>
        <label for="text-input">문구 (여러 줄 가능, 줄바꿈은 그대로 반영됩니다)</label>
        <textarea id="text-input" placeholder="여기에 문구를 입력하세요"></textarea>

        <label for="pos-x">가로 위치</label>
        <input type="range" id="pos-x" min="0" max="100" value="50">
        <label for="pos-y">세로 위치</label>
        <input type="range" id="pos-y" min="0" max="100" value="50">
        <label for="font-size">글자 크기</label>
        <input type="range" id="font-size" min="2" max="20" value="8" step="0.5">
        <label for="text-color">글자 색</label>
        <input type="color" id="text-color" value="#ffffff">
      </div>
    </div>

    <div class="side-col">
      <div class="card">
        <h2>템플릿</h2>
        <label for="tpl-name">템플릿 이름</label>
        <div class="row">
          <input type="text" id="tpl-name" class="grow" placeholder="예: 생일 카드">
          <button type="button" id="btn-tpl-save" class="primary">저장</button>
        </div>
        <p class="msg" id="tpl-msg" aria-live="polite"></p>
        <div id="tpl-list"></div>
        <p class="small-note" id="tpl-empty">아직 저장된 템플릿이 없습니다.</p>
      </div>

      <div class="card">
        <h2>백업 (JSON)</h2>
        <div class="row">
          <button type="button" id="btn-export-json">전체 템플릿 내보내기</button>
          <button type="button" id="btn-import-json-trigger">가져오기(덮어쓰기)</button>
          <input type="file" id="import-json-input" accept="application/json,.json" style="display:none;">
        </div>
        <p class="msg" id="json-msg" aria-live="polite"></p>
        <p class="field-hint">가져오기는 문법이 올바르고 필수 항목(id·name·aspectRatio·text)이 모두 있는 JSON만 적용됩니다. 문제가 있으면 기존 템플릿은 그대로 유지됩니다.</p>
      </div>
    </div>
  </div>
</main>

<script>
(function(){
  "use strict";

  var RATIOS = { "1:1":[1080,1080], "4:5":[1080,1350], "9:16":[1080,1920] };
  var TPL_KEY = "t03-templates-v1";

  var canvas = document.getElementById("stage");
  var ctx = canvas.getContext("2d");

  var state = {
    ratio: "1:1",
    image: null,          // HTMLImageElement | null
    bgColor: "#111827",
    text: "",
    xFrac: 0.5,
    yFrac: 0.5,
    sizePct: 8,
    color: "#ffffff"
  };
  var editingTemplateId = null; // 현재 불러와 편집 중인 템플릿 (수정 대상 판별용, 배열 인덱스 사용 안 함)

  // ---- 요소 참조 ----
  var fileInput = document.getElementById("file-input");
  var fileMsg = document.getElementById("file-msg");
  var bgColorInput = document.getElementById("bg-color");
  var btnRemoveImage = document.getElementById("btn-remove-image");
  var btnDownload = document.getElementById("btn-download");
  var textInput = document.getElementById("text-input");
  var posX = document.getElementById("pos-x");
  var posY = document.getElementById("pos-y");
  var fontSize = document.getElementById("font-size");
  var textColor = document.getElementById("text-color");
  var tplNameInput = document.getElementById("tpl-name");
  var btnTplSave = document.getElementById("btn-tpl-save");
  var tplMsg = document.getElementById("tpl-msg");
  var tplList = document.getElementById("tpl-list");
  var tplEmpty = document.getElementById("tpl-empty");
  var btnExportJson = document.getElementById("btn-export-json");
  var btnImportTrigger = document.getElementById("btn-import-json-trigger");
  var importJsonInput = document.getElementById("import-json-input");
  var jsonMsg = document.getElementById("json-msg");

  // ---- 화면비 ----
  document.querySelectorAll(".ratio-btn").forEach(function(btn){
    btn.addEventListener("click", function(){
      document.querySelectorAll(".ratio-btn").forEach(function(b){ b.classList.remove("active"); });
      btn.classList.add("active");
      state.ratio = btn.getAttribute("data-ratio");
      applyCanvasSize();
      redraw();
    });
  });

  function applyCanvasSize(){
    var wh = RATIOS[state.ratio];
    canvas.width = wh[0];
    canvas.height = wh[1];
  }

  // ---- 텍스트 줄바꿈: 명시적 개행 + 단어 단위 + (단어가 너무 길면) 글자 단위 폴백 ----
  function wrapText(context, text, maxWidth){
    var paragraphs = text.split("\n");
    var lines = [];
    paragraphs.forEach(function(p){
      if(p === ""){ lines.push(""); return; }
      var words = p.split(" ");
      var current = "";
      words.forEach(function(word){
        if(word === ""){
          // 연속 공백 보존
          var trial = current + " ";
          current = trial;
          return;
        }
        var trial = current === "" ? word : current + " " + word;
        if(context.measureText(trial).width <= maxWidth){
          current = trial;
        }else{
          if(current !== ""){ lines.push(current); current = ""; }
          // 단어 자체가 maxWidth보다 넓으면 글자 단위로 쪼갬 (공백 없는 긴 문자열/이모지 대응)
          if(context.measureText(word).width > maxWidth){
            var chars = Array.from(word);
            var buf = "";
            chars.forEach(function(ch){
              var t2 = buf + ch;
              if(context.measureText(t2).width <= maxWidth || buf === ""){
                buf = t2;
              }else{
                lines.push(buf);
                buf = ch;
              }
            });
            current = buf;
          }else{
            current = word;
          }
        }
      });
      lines.push(current);
    });
    return lines;
  }

  function drawCover(image, W, H){
    var scale = Math.max(W / image.naturalWidth, H / image.naturalHeight);
    var dw = image.naturalWidth * scale;
    var dh = image.naturalHeight * scale;
    var dx = (W - dw) / 2;
    var dy = (H - dh) / 2;
    ctx.drawImage(image, dx, dy, dw, dh);
  }

  function redraw(){
    var W = canvas.width, H = canvas.height;
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = state.bgColor;
    ctx.fillRect(0, 0, W, H);

    if(state.image){
      drawCover(state.image, W, H);
    }

    var text = state.text;
    if(text && text.trim() !== ""){
      var fontPx = Math.max(4, (state.sizePct / 100) * H);
      ctx.font = fontPx + "px -apple-system, 'Segoe UI', 'Malgun Gothic', 'Apple Color Emoji', 'Segoe UI Emoji', sans-serif";
      ctx.fillStyle = state.color;
      ctx.textAlign = "center";
      ctx.textBaseline = "alphabetic";

      var maxWidth = W * 0.9;
      var lines = wrapText(ctx, text, maxWidth);
      var lineHeight = fontPx * 1.3;
      var totalHeight = lines.length * lineHeight;
      var anchorX = state.xFrac * W;
      var startY = state.yFrac * H - totalHeight / 2 + fontPx;

      lines.forEach(function(line, i){
        ctx.fillText(line, anchorX, startY + i * lineHeight);
      });
    }
  }

  // ---- 이미지 불러오기 (검증 실패 시 기존 상태 유지) ----
  function showFileMsg(text, isError){
    fileMsg.textContent = text;
    fileMsg.className = "msg" + (isError ? " error" : " ok");
  }

  fileInput.addEventListener("change", function(){
    var file = fileInput.files && fileInput.files[0];
    fileInput.value = "";
    if(!file) return;

    var validTypes = ["image/png", "image/jpeg"];
    if(validTypes.indexOf(file.type) === -1){
      showFileMsg("지원하지 않는 파일 형식입니다 (PNG 또는 JPEG만 가능). 감지된 형식: " + (file.type || "알 수 없음"), true);
      return; // 기존 이미지·문구 유지
    }

    // blob: URL은 새로고침하면 무효화되어 저장된 템플릿에 쓸 수 없으므로,
    // 오래 남아도 되는 data: URL(base64)로 읽어들입니다.
    var reader = new FileReader();
    reader.onload = function(){
      var img = new Image();
      img.onload = function(){
        state.image = img;
        redraw();
        showFileMsg("이미지를 불러왔습니다 (" + file.type + ").", false);
      };
      img.onerror = function(){
        showFileMsg("이미지를 열 수 없습니다. 파일이 손상된 것 같습니다.", true);
      };
      img.src = String(reader.result);
    };
    reader.onerror = function(){
      showFileMsg("파일을 읽을 수 없습니다.", true);
    };
    reader.readAsDataURL(file);
  });

  btnRemoveImage.addEventListener("click", function(){
    state.image = null;
    redraw();
    showFileMsg("이미지를 제거했습니다. 배경색만 사용합니다.", false);
  });

  bgColorInput.addEventListener("input", function(){
    state.bgColor = bgColorInput.value;
    redraw();
  });

  textInput.addEventListener("input", function(){
    state.text = textInput.value;
    redraw();
  });
  posX.addEventListener("input", function(){
    state.xFrac = Number(posX.value) / 100;
    redraw();
  });
  posY.addEventListener("input", function(){
    state.yFrac = Number(posY.value) / 100;
    redraw();
  });
  fontSize.addEventListener("input", function(){
    state.sizePct = Number(fontSize.value);
    redraw();
  });
  textColor.addEventListener("input", function(){
    state.color = textColor.value;
    redraw();
  });

  // ---- 다운로드 (미리보기와 동일한 캔버스를 그대로 내보냄) ----
  btnDownload.addEventListener("click", function(){
    canvas.toBlob(function(blob){
      if(!blob) return;
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = "card-" + state.ratio.replace(":", "x") + "-" + Date.now() + ".png";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
    }, "image/png");
  });

  // ---- 템플릿 저장소 ----
  function loadTemplates(){
    try{
      var raw = localStorage.getItem(TPL_KEY);
      if(!raw) return [];
      var parsed = JSON.parse(raw);
      if(!Array.isArray(parsed)) return [];
      return parsed;
    }catch(e){
      return [];
    }
  }
  function persistTemplates(list){
    try{
      localStorage.setItem(TPL_KEY, JSON.stringify(list));
      return true;
    }catch(e){
      return false; // 용량 초과 등으로 저장 실패 — 호출한 쪽에서 반드시 확인해야 함
    }
  }
  function makeId(){
    return "t" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }
  function isValidTemplate(t){
    return t && typeof t === "object" &&
      typeof t.id === "string" &&
      typeof t.name === "string" &&
      typeof t.aspectRatio === "string" &&
      RATIOS.hasOwnProperty(t.aspectRatio) &&
      typeof t.text === "object" && t.text !== null;
  }

  var templates = loadTemplates();

  function renderTemplateList(){
    tplList.innerHTML = "";
    tplEmpty.style.display = templates.length === 0 ? "block" : "none";
    templates.forEach(function(t){
      var row = document.createElement("div");
      row.className = "tpl-item";
      var nameSpan = document.createElement("span");
      nameSpan.className = "name";
      nameSpan.textContent = t.name + (editingTemplateId === t.id ? " (편집 중)" : "");
      row.appendChild(nameSpan);

      var btnLoad = document.createElement("button");
      btnLoad.type = "button";
      btnLoad.textContent = "불러오기";
      btnLoad.addEventListener("click", function(){ loadTemplateIntoEditor(t.id); });
      row.appendChild(btnLoad);

      var btnUpdate = document.createElement("button");
      btnUpdate.type = "button";
      btnUpdate.textContent = "현재 내용으로 수정";
      btnUpdate.addEventListener("click", function(){ updateTemplate(t.id); });
      row.appendChild(btnUpdate);

      var btnDelete = document.createElement("button");
      btnDelete.type = "button";
      btnDelete.textContent = "삭제";
      btnDelete.addEventListener("click", function(){ deleteTemplate(t.id); });
      row.appendChild(btnDelete);

      tplList.appendChild(row);
    });
  }

  function templateFromState(id, name){
    return {
      id: id,
      name: name,
      aspectRatio: state.ratio,
      bgColor: state.bgColor,
      imageDataURL: state.image ? state.image.src : null,
      text: {
        content: state.text,
        xFrac: state.xFrac,
        yFrac: state.yFrac,
        sizePct: state.sizePct,
        color: state.color
      }
    };
  }

  btnTplSave.addEventListener("click", function(){
    var name = tplNameInput.value.trim();
    if(name === ""){
      tplMsg.textContent = "템플릿 이름을 입력하세요.";
      tplMsg.className = "msg error";
      return;
    }
    var t = templateFromState(makeId(), name);
    var next = templates.concat([t]);
    if(persistTemplates(next)){
      templates = next;
      renderTemplateList();
      tplMsg.textContent = "\"" + name + "\" 템플릿을 저장했습니다.";
      tplMsg.className = "msg ok";
      tplNameInput.value = "";
    }else{
      renderTemplateList(); // 저장 실패 시 화면은 실제 저장된 상태(기존 목록)로 되돌림
      tplMsg.textContent = "저장 공간이 부족해서 템플릿을 저장하지 못했습니다. 이미지 용량을 줄이거나 다른 템플릿을 정리해주세요.";
      tplMsg.className = "msg error";
    }
  });

  function findTemplate(id){
    for(var i = 0; i < templates.length; i++){
      if(templates[i].id === id) return templates[i];
    }
    return null;
  }

  function loadTemplateIntoEditor(id){
    var t = findTemplate(id);
    if(!t) return;
    editingTemplateId = id;
    state.ratio = t.aspectRatio;
    state.bgColor = t.bgColor || "#111827";
    state.text = (t.text && t.text.content) || "";
    state.xFrac = (t.text && t.text.xFrac != null) ? t.text.xFrac : 0.5;
    state.yFrac = (t.text && t.text.yFrac != null) ? t.text.yFrac : 0.5;
    state.sizePct = (t.text && t.text.sizePct != null) ? t.text.sizePct : 8;
    state.color = (t.text && t.text.color) || "#ffffff";

    document.querySelectorAll(".ratio-btn").forEach(function(b){
      b.classList.toggle("active", b.getAttribute("data-ratio") === state.ratio);
    });
    applyCanvasSize();
    bgColorInput.value = state.bgColor;
    textInput.value = state.text;
    posX.value = Math.round(state.xFrac * 100);
    posY.value = Math.round(state.yFrac * 100);
    fontSize.value = state.sizePct;
    textColor.value = state.color;

    if(t.imageDataURL){
      var img = new Image();
      img.onload = function(){ state.image = img; redraw(); };
      img.onerror = function(){ state.image = null; redraw(); };
      img.src = t.imageDataURL;
    }else{
      state.image = null;
      redraw();
    }
    tplMsg.textContent = "\"" + t.name + "\" 템플릿을 불러왔습니다.";
    tplMsg.className = "msg ok";
    renderTemplateList();
  }

  function updateTemplate(id){
    var t = findTemplate(id);
    if(!t) return;
    var updated = templateFromState(id, t.name);
    var idx = templates.findIndex(function(x){ return x.id === id; });
    var next = templates.slice();
    next[idx] = updated;
    if(persistTemplates(next)){
      templates = next;
      tplMsg.textContent = "\"" + t.name + "\" 템플릿을 현재 편집 내용으로 수정했습니다.";
      tplMsg.className = "msg ok";
    }else{
      tplMsg.textContent = "저장 공간이 부족해서 수정 내용을 저장하지 못했습니다. 이전 내용이 유지됩니다.";
      tplMsg.className = "msg error";
    }
    renderTemplateList();
  }

  function deleteTemplate(id){
    var t = findTemplate(id);
    templates = templates.filter(function(x){ return x.id !== id; });
    persistTemplates(templates);
    if(editingTemplateId === id) editingTemplateId = null;
    tplMsg.textContent = t ? ("\"" + t.name + "\" 템플릿을 삭제했습니다.") : "삭제했습니다.";
    tplMsg.className = "msg ok";
    renderTemplateList();
  }

  // ---- JSON 백업 내보내기/가져오기 ----
  btnExportJson.addEventListener("click", function(){
    var blob = new Blob([JSON.stringify(templates, null, 2)], { type: "application/json" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "t03-templates-" + Date.now() + ".json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  });

  btnImportTrigger.addEventListener("click", function(){ importJsonInput.click(); });

  importJsonInput.addEventListener("change", function(){
    var file = importJsonInput.files && importJsonInput.files[0];
    importJsonInput.value = "";
    if(!file) return;

    var reader = new FileReader();
    reader.onload = function(){
      var parsed;
      try{
        parsed = JSON.parse(String(reader.result));
      }catch(e){
        jsonMsg.textContent = "가져오기 실패: JSON 문법이 올바르지 않습니다. 기존 템플릿을 그대로 유지합니다.";
        jsonMsg.className = "msg error";
        return;
      }
      if(!Array.isArray(parsed) || !parsed.every(isValidTemplate)){
        jsonMsg.textContent = "가져오기 실패: 필수 항목(id·name·aspectRatio·text)이 없는 템플릿이 있습니다. 기존 템플릿을 그대로 유지합니다.";
        jsonMsg.className = "msg error";
        return;
      }
      if(persistTemplates(parsed)){
        templates = parsed;
        renderTemplateList();
        jsonMsg.textContent = "템플릿 " + templates.length + "개를 가져왔습니다.";
        jsonMsg.className = "msg ok";
      }else{
        jsonMsg.textContent = "가져오기 실패: 저장 공간이 부족합니다. 기존 템플릿을 그대로 유지합니다.";
        jsonMsg.className = "msg error";
      }
    };
    reader.onerror = function(){
      jsonMsg.textContent = "가져오기 실패: 파일을 읽을 수 없습니다. 기존 템플릿을 그대로 유지합니다.";
      jsonMsg.className = "msg error";
    };
    reader.readAsText(file);
  });

  // ---- 초기화 ----
  applyCanvasSize();
  renderTemplateList();
  redraw();
})();
</script>
</body>
</html>
